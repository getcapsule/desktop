<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>capsule · Experimental YouTube player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #101010; color: #eee; font: 14px system-ui, sans-serif; }
    body { display: grid; grid-template-rows: minmax(270px, 1fr) auto; min-width: 480px; min-height: 326px; }
    #player { width: 100%; height: 100%; min-width: 480px; min-height: 270px; border: 0; }
    #status { margin: 0; padding: 14px 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="player" aria-label="YouTube video player"></div>
  <p id="status" role="status" aria-live="polite">Experimental YouTube player · Loading the official player. Playback is unverified.</p>
  <script src="/player.js"></script>
</body>
</html>
