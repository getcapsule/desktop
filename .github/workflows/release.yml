name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag containing the source and packaging changes
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            libfuse2 \
            patchelf \
            file
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - name: Build installers and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: capsule ${{ inputs.tag || github.ref_name }}
          args: ${{ matrix.args }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## Downloads

            **Windows:** use the `.exe` installer. The build is unsigned.

            **Linux / Arch:** use the `.AppImage` file and mark it executable before opening it.
            **Debian / Ubuntu:** the `.deb` package is also available.

            Local files, Navidrome, public YouTube playback, and SoundCloud are supported.
            Acrylic and mica window materials are Windows-only.
      - name: Verify Linux release packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if (( ${#appimages[@]} == 0 || ${#debs[@]} == 0 )); then
            echo "::error::Expected both AppImage and Debian release packages."
            exit 1
          fi
          ls -lh "${appimages[@]}" "${debs[@]}"
      - name: Retain Linux packages as workflow artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: capsule-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
