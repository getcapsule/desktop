name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag containing the source and packaging changes
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Verify installer version matches release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $version -or $env:RELEASE_TAG -cne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' does not match the Tauri installer version '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            libfuse2 \
            patchelf \
            file
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - name: Build installers and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: capsule ${{ inputs.tag || github.ref_name }}
          args: ${{ matrix.args }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## Downloads

            **Windows:** use the `.exe` installer. The build is unsigned.

            **Linux / Arch:** use the `.AppImage` file and mark it executable before opening it.
            **Debian / Ubuntu:** the `.deb` package is also available.
            ${{ hashFiles('packaging/nix/flake.nix') != '' && format('**NixOS (x86_64):** from your desktop session, run `nix --extra-experimental-features "nix-command flakes" run tarball+{0}/{1}/releases/download/{2}/capsule_{3}_x86_64-linux-flake.tar.gz`.', github.server_url, github.repository, inputs.tag || github.ref_name, steps.version.outputs.version) || '' }}

            Local files, Navidrome, public YouTube playback, and SoundCloud are supported.
            Acrylic and mica window materials are Windows-only.
      - name: Verify Linux release packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if (( ${#appimages[@]} == 0 || ${#debs[@]} == 0 )); then
            echo "::error::Expected both AppImage and Debian release packages."
            exit 1
          fi
          ls -lh "${appimages[@]}" "${debs[@]}"
      - name: Retain Linux packages as workflow artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: capsule-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Install Nix
        if: runner.os == 'Linux' && hashFiles('packaging/nix/flake.nix') != ''
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build Nix flake archive
        if: runner.os == 'Linux' && hashFiles('packaging/nix/flake.nix') != ''
        id: flake
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          appimage="src-tauri/target/release/bundle/appimage/capsule_${RELEASE_VERSION}_amd64.AppImage"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/${appimage##*/}"
          archive="capsule_${RELEASE_VERSION}_x86_64-linux-flake.tar.gz"
          hash=$(nix hash file "$appimage")

          staging=$(mktemp -d)
          mkdir "$staging/capsule-flake"
          install -m 644 packaging/nix/flake.nix packaging/nix/flake.lock "$staging/capsule-flake/"
          jq -n --arg version "$RELEASE_VERSION" --arg url "$url" --arg hash "$hash" \
            '{version: $version, url: $url, hash: $hash}' > "$staging/capsule-flake/appimage.json"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$staging" capsule-flake

          flake="tarball+file://$PWD/$archive"
          nix flake check --no-update-lock-file "$flake"
          package=$(nix build --no-link --no-update-lock-file --print-out-paths "$flake")
          test -x "$package/bin/capsule"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Publish Nix flake
        if: steps.flake.outputs.archive != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          FLAKE_ARCHIVE: ${{ steps.flake.outputs.archive }}
        run: gh release upload "$RELEASE_TAG" "$FLAKE_ARCHIVE" --clobber
